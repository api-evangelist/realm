name: Realm
description: >-
  Realm is a consumer home-technology company that gives homeowners data-driven
  insights about their property's value and its renovation potential. The Realm
  platform combines public property records, permits, zoning, comparable sales,
  and neighborhood data into personalized recommendations that show which home
  improvement projects will add the most value, what they are likely to cost,
  and how they affect a home's estimated worth over time. Marketed at
  realmhome.com as "Home Renovation Planning & Home Value Insights," the product
  is delivered as a consumer-facing web and mobile experience rather than a
  developer platform. Realm was backed by venture investors including DCVC and
  GGV Capital and is tracked in the API Evangelist network as a company profile.
